<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arb Screener</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Arb Screener</h1>
      <div class="controls">
        <label class="stake-label">
          Total stake
          <input type="number" id="totalStake" value="100" min="0" step="1" inputmode="decimal" />
        </label>
        <label class="auto-refresh-label">
          <input type="checkbox" id="autoRefresh" checked />
          Auto-refresh
        </label>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>
    </header>

    <button id="filtersToggleBtn" class="filters-toggle" type="button" aria-expanded="true">
      <span class="filters-toggle-label">Filters</span>
      <span id="filtersSummary" class="filters-summary"></span>
      <span class="filters-chevron" aria-hidden="true">▾</span>
    </button>

    <div id="filtersPanel" class="filters-panel">
      <div class="filter-group">
        <div class="section-header">
          <button id="sportsToggleBtn" class="section-toggle" type="button" aria-expanded="true">
            <span class="filters-chevron" aria-hidden="true">▾</span>
            <span class="section-title">Sports</span>
            <span id="sportsSectionSummary" class="section-summary"></span>
          </button>
          <button id="toggleAllSportsBtn" class="toggle-all-btn" type="button" style="display: none;">Select All</button>
        </div>
        <div id="sportsPanel" class="books-panel"></div>
      </div>

      <div id="leagueRow" class="filter-group sport-panel" hidden>
        <span class="books-title">League</span>
        <select id="leagueSelect"><option value="">Select a sport first</option></select>
      </div>

      <div id="sportLeagueNote" class="sport-league-note" hidden></div>
      <div id="scanScopeNote" class="sport-league-note" hidden></div>

      <div class="filter-group">
        <div class="section-header">
          <button id="booksToggleBtn" class="section-toggle" type="button" aria-expanded="true">
            <span class="filters-chevron" aria-hidden="true">▾</span>
            <span class="section-title">Sportsbooks</span>
            <span id="booksSectionSummary" class="section-summary"></span>
          </button>
          <button id="toggleAllBtn" class="toggle-all-btn" type="button" style="display: none;">Select All</button>
        </div>
        <div id="booksSectionBody">
          <div id="booksPanel" class="books-panel"></div>
          <form id="addBookForm" class="add-book-form">
            <input type="text" id="addBookInput" placeholder="Add a sportsbook id (e.g. caesars)" autocomplete="off" />
            <button type="submit" class="add-book-btn">Add</button>
          </form>
        </div>
      </div>

      <div class="filter-group filter-row">
        <label class="live-filter-label">
          Show
          <select id="liveFilter">
            <option value="all">All events</option>
            <option value="live">Live only</option>
            <option value="prematch">Pre-match only</option>
          </select>
        </label>
        <label class="live-filter-label">
          Min profit
          <input type="number" id="minProfitFilter" value="0" min="0" step="0.1" inputmode="decimal" style="width: 70px;" />%
        </label>
        <label class="live-filter-label">
          Sort
          <select id="sortBy">
            <option value="profit">Highest profit first</option>
            <option value="soonest">Starting soonest</option>
          </select>
        </label>
      </div>
    </div>

    <div id="status" class="status"></div>
    <div id="arbList" class="arb-list"></div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
